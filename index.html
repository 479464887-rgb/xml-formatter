<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="XML Formatter - XML代码格式化与美化工具"><meta property="og:title" content="XML Formatter"><title>XML Formatter</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}header{background:#161b22;border-bottom:1px solid #30363d;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}header h1{font-size:20px;color:#58a6ff}.lang-switch{display:flex;gap:4px}.lang-switch button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}.lang-switch button.active{background:#1f6feb;border-color:#1f6feb;color:#fff}.container{max-width:1200px;margin:0 auto;padding:24px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.btn{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}.btn:hover{background:#30363d}.btn-primary{background:#238636;border-color:#238636;color:#fff}.btn-primary:hover{background:#2ea043}.options label{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:8px}.options input[type=number]{width:60px;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;padding:4px 8px;font-size:13px}.panel{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden;margin-bottom:16px}.panel-header{background:#21262d;padding:10px 16px;font-size:13px;font-weight:600;border-bottom:1px solid #30363d;color:#58a6ff}.panel textarea{width:100%;height:350px;background:#0d1117;color:#c9d1d9;border:none;padding:12px;font-family:monospace;font-size:13px;resize:vertical;line-height:1.5}.panel textarea:focus{outline:none}.error{color:#f85149;font-size:13px;padding:12px 16px}</style></head><body><header><h1>📋 XML Formatter</h1><div class="lang-switch"><button class="active" onclick="setLang('zh')">中文</button><button onclick="setLang('en')">EN</button></div></header><div class="container"><div class="options"><label>缩进 <input type="number" id="indent" value="2" min="1" max="8"></label></div><div class="toolbar"><button class="btn btn-primary" onclick="formatXML()">✨ 格式化</button><button class="btn" onclick="minifyXML()">📦 压缩</button><button class="btn" onclick="copyOutput()">📋 复制</button><button class="btn" onclick="clearAll()">🗑 清空</button></div><div class="panel"><div class="panel-header">输入 XML</div><textarea id="input" placeholder="<root><item id='1'><name>Test</name></item></root>"></textarea></div><div class="panel"><div class="panel-header">输出</div><textarea id="output" readonly placeholder="格式化结果将在这里显示..."></textarea><div class="error" id="error"></div></div></div><script>let lang='zh';function setLang(l){lang=l;document.querySelectorAll('.lang-switch button').forEach((b,i)=>b.classList.toggle('active',(i===0&&l==='zh')||(i===1&&l==='en')))}function formatXML(){const input=document.getElementById('input').value.trim();document.getElementById('error').textContent='';if(!input){document.getElementById('output').value=lang==='zh'?'请输入XML':'Enter XML';return}try{const indent=' '.repeat(parseInt(document.getElementById('indent').value)||2);let result='';let depth=0;let i=0;while(i<input.length){if(input[i]==='<'){if(input[i+1]==='/'){depth=Math.max(0,depth-1);let j=input.indexOf('>',i);if(j===-1)throw new Error('Invalid XML');result+='\n'+' '.repeat(depth*indent.length)+input.substring(i,j+1);i=j+1}else if(input[i+1]==='?'||input[i+1]==='!'){let j=input.indexOf('>',i);result+=(result?'\n':'')+input.substring(i,Math.min(j+1,input.length));i=j+1}else{let j=input.indexOf('>',i);if(j===-1)throw new Error('Invalid XML');let tag=input.substring(i,j+1);let selfClose=tag.endsWith('/>');let sp=tag.indexOf(' ');let tname=sp>0?tag.substring(1,sp):tag.substring(1,tag.length-(selfClose?2:1));result+=(i>0?'\n':'')+' '.repeat(depth*indent.length)+tag;if(!selfClose)depth++;i=j+1}}else{let j=input.indexOf('<',i);if(j===-1)j=input.length;let text=input.substring(i,j).trim();if(text)result+='\n'+' '.repeat(depth*indent.length)+text;i=j}}document.getElementById('output').value=result.trim()}catch(e){document.getElementById('error').textContent='❌ '+e.message}}function minifyXML(){const input=document.getElementById('input').value;document.getElementById('error').textContent='';document.getElementById('output').value=input.replace(/>\s+</g,'><').replace(/\s+/g,' ').replace(/<!--[\s\S]*?-->/g,'').trim()}function copyOutput(){document.getElementById('output').select();document.execCommand('copy')}function clearAll(){document.getElementById('input').value='';document.getElementById('output').value='';document.getElementById('error').textContent=''}</script></body></html>
